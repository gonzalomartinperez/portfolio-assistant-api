[project]
name = "portfolio-assistant-api"
version = "1.0.0"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "langchain-core>=1.7.3,<2",
    "langsmith==0.14.16",
    "langgraph>=1.2.19,<2",
    "langgraph-checkpoint-postgres>=3.2.0,<4",
    "lingua-language-detector==2.2.0",
    "neo4j>=6.4.1,<7",
    "openai>=3.42.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2",
    "opentelemetry-sdk>=1,<2",
    "prometheus-client>=0.22,<1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.2,<3",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "pyyaml==6.0.3",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
extend-select = ["I", "N", "UP", "D200", "D201", "D202", "D205", "D209", "D210", "D300", "D403", "D415", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's immutable dependency markers are intentionally evaluated in signatures.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: requires isolated PostgreSQL/pgvector and Neo4j"]

[tool.mypy]
files = ["app/domain", "app/application", "app/ai", "scripts/database_security_receipt.py", "app/adapters/neo4j/read_queries.py"]
strict = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff.per-file-target-version]
# Privileged stdlib-only jobs use the hosted runner's system Python, not application dependencies.
"scripts/dependabot*.py" = "py312"
"scripts/release_manifest.py" = "py312"
"scripts/validate_release_file.py" = "py312"
