[project]
name = "portfolio-assistant-api"
version = "1.0.0"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.143.3",
    "langchain-core>=1.6.12,<2",
    "langsmith==0.14.9",
    "langgraph>=1.2.16,<2",
    "langgraph-checkpoint-postgres>=3.1.3,<4",
    "lingua-language-detector==2.2.0",
    "neo4j>=6.4.1,<7",
    "openai>=3.33.0",
    "opentelemetry-exporter-otlp-proto-http>=1,<2",
    "opentelemetry-sdk>=1,<2",
    "prometheus-client>=0.22,<1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
assistant-api = "portfolio_assistant.bootstrap.entrypoints.api:main"
assistant-migrate = "portfolio_assistant.bootstrap.entrypoints.migrate:main"
assistant-retention = "portfolio_assistant.bootstrap.entrypoints.retention:main"
assistant-knowledge-sync = "portfolio_assistant.bootstrap.entrypoints.knowledge_sync:main"
assistant-knowledge-watch = "portfolio_assistant.bootstrap.entrypoints.knowledge_watch:main"

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["portfolio_assistant", "app"]
module-root = "src"

[dependency-groups]
dev = [
    "diff-cover>=11.0.2",
    "httpx>=0.28.1",
    "hypothesis>=6",
    "import-linter>=2.17",
    "jsonschema>=4.26.0",
    "mutmut>=3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml==6.0.3",
    "ruff>=0.17.1",
    "schemathesis>=4.33.4",
    "vulture>=2.16",
]
eval = [
    "ranx>=0.3.21",
]
load = [
    "locust>=2.47.0",
]

[tool.importlinter]
root_package = "portfolio_assistant"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Application layer direction"
type = "layers"
containers = ["portfolio_assistant"]
layers = [
    "main",
    "bootstrap",
    "presentation | adapters | ai",
    "application",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Inner layers avoid third-party and platform I/O imports"
type = "forbidden"
source_modules = ["portfolio_assistant.domain", "portfolio_assistant.application"]
# External submodules are collapsed to their top-level package. The AST guard
# handles urllib.request and enforces the open-ended stdlib-only rule.
forbidden_modules = [
    "fastapi",
    "http",
    "httpx",
    "langchain_core",
    "langgraph",
    "neo4j",
    "openai",
    "os",
    "psycopg",
    "psycopg_pool",
    "pydantic",
    "socket",
    "sqlite3",
    "starlette",
    "subprocess",
    "uvicorn",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Application siblings are acyclic"
type = "acyclic_siblings"
ancestors = ["portfolio_assistant"]

[tool.vulture]
paths = ["src", "scripts"]
min_confidence = 80
ignore_names = [
    "cls", # Pydantic classmethod validators.
    # Type imports used only in string arguments to cast().
    "AsyncConnection",
    "DictRow",
    "ResponseInputParam",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["W", "F", "I", "B", "UP", "PIE", "LOG", "G", "N", "RET", "D200", "D201", "D202", "D205", "D209", "D210", "D300", "D403", "D415", "D417", "C90"]

[tool.ruff.lint.mccabe]
# M4-2: every function in src/portfolio_assistant/ stays at cyclomatic complexity 10 or less.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# The complexity gate covers the application package (roadmap M4-2); tooling, tests and the
# frozen legacy copies kept for characterization are outside it.
"tests/**" = ["C901"]
"scripts/**" = ["C901"]
"evals/**" = ["C901"]
"contracts/**" = ["C901"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's immutable dependency markers are intentionally evaluated in signatures.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires isolated PostgreSQL/pgvector and Neo4j",
    "contract: public API contract, schema and SSE conformance (offline)",
    "property: Hypothesis property-based tests (profiles ci and nightly)",
]

[tool.mypy]
files = ["src", "evals", "scripts/database_security_receipt.py"]
strict = true

[tool.ruff.format]
quote-style = "double"

[tool.ruff.per-file-target-version]
# Privileged stdlib-only jobs use the hosted runner's system Python, not application dependencies.
"scripts/release_manifest.py" = "py312"
"scripts/validate_release_file.py" = "py312"

[tool.mutmut]
paths_to_mutate = [
    "src/portfolio_assistant/domain/budget.py",
    "src/portfolio_assistant/domain/privacy.py",
    "src/portfolio_assistant/domain/evidence.py",
    "src/portfolio_assistant/domain/analytics_periods.py",
    "src/portfolio_assistant/domain/web_policy.py",
    "src/portfolio_assistant/application/answer.py",
    "src/portfolio_assistant/application/runs.py",
    "src/portfolio_assistant/application/contracts.py",
    "src/portfolio_assistant/ai/retrieval/__init__.py",
    "src/portfolio_assistant/ai/retrieval/candidates.py",
    "src/portfolio_assistant/ai/retrieval/fusion.py",
    "src/portfolio_assistant/ai/retrieval/pipeline.py",
    "src/portfolio_assistant/ai/retrieval/query.py",
    "src/portfolio_assistant/ai/retrieval/rerank.py",
    "src/portfolio_assistant/ai/retrieval/select.py",
    "src/portfolio_assistant/ai/retrieval/source_shape.py",
]
tests_dir = [
    "tests/unit/test_operations.py",
    "tests/unit/test_visitor_privacy.py",
    "tests/unit/test_quality.py",
    "tests/unit/test_analytics_periods.py",
    "tests/unit/test_web_context.py",
    "tests/unit/test_workflow.py",
    "tests/unit/test_citation_mapping.py",
    "tests/unit/test_content_root_compatibility.py",
    "tests/unit/test_conversation_context.py",
    "tests/unit/test_presentation_context.py",
]
also_copy = ["src/portfolio_assistant", "contracts"]
process_isolation = "fork"
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider", "-m", "not integration"]

[tool.coverage.run]
branch = true
source = ["src/portfolio_assistant", "src/app"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
