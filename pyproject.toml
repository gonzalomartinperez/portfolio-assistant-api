[project]
name = "portfolio-assistant-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-core>=1.6.5",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "neo4j>=6.3.1",
    "openai>=3.19.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pyyaml==6.0.3",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
extend-select = ["I", "N", "UP", "D200", "D201", "D202", "D205", "D209", "D210", "D300", "D403", "D415", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's immutable dependency markers are intentionally evaluated in signatures.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: requires isolated PostgreSQL/pgvector and Neo4j"]

[tool.mypy]
files = ["app/domain", "app/application", "app/ai"]
strict = true

[tool.ruff.format]
quote-style = "single"
