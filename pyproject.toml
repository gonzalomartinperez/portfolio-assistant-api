[project]
name = "portfolio-assistant-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-core>=1.6.5",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "neo4j>=6.3.1",
    "openai>=3.19.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]

[tool.pytest.ini_options]
pythonpath = ["."]
