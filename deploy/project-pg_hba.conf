# Portfolio-only template; vps-ops owns effective networks/TLS and activation.
# Bootstrap is local-socket only. No trust authentication or remote admin rule.
local all portfolio_bootstrap scram-sha-256
local portfolio_assistant portfolio_api_migrator,portfolio_api_runtime,portfolio_api_worker scram-sha-256
local portfolio_iam portfolio_iam_migrator,portfolio_iam_runtime scram-sha-256
host portfolio_assistant portfolio_api_migrator,portfolio_api_runtime,portfolio_api_worker all scram-sha-256
host portfolio_iam portfolio_iam_migrator,portfolio_iam_runtime all scram-sha-256
local all all reject
host all all all reject
