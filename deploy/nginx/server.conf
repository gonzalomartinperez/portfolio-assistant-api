server {
    listen 8080;
    server_name assistant.gonzalomartinperez.com;
    return 308 https://assistant.gonzalomartinperez.com$request_uri;
}
server {
    listen 8443 ssl;
    server_name assistant.gonzalomartinperez.com;
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    include /etc/nginx/routes.conf;
}
