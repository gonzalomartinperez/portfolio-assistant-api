name: Cross-repository compatibility
# Reads portfolio-backoffice, so it stays out of the pull request path (PAA-D2, ADR016).
'on':
  schedule:
  - cron: 0 6 * * *
  workflow_dispatch:
    inputs:
      frontend_commit:
        description: Optional portfolio-backoffice commit whose private contract bytes must match
        type: string
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: cross-repo-${{ github.ref }}
  cancel-in-progress: true
env:
  AI_PROVIDER: fixture
  ALLOW_PAID_AI: 'false'
  LANGSMITH_TRACING: 'false'
jobs:
  iam-compatibility:
    name: Backoffice IAM compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Bind exact source and build inputs
      run: python3 -m scripts.ci_identity
      env:
        CI_BASE_SHA: ${{ github.event.before }}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.1
        save-cache: false
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          .python-version
    - name: Install locked dependencies
      run: uv sync --frozen
    - name: Read the pinned IAM compatibility source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: gonzalomartinperez/portfolio-backoffice
        ref: 5238643d5f5cb1c129b66b7d527f440635f68d33
        path: artifacts/compat-backoffice
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: artifacts/compat-backoffice/.nvmrc
        cache: npm
        cache-dependency-path: artifacts/compat-backoffice/package-lock.json
    - name: Install the pinned IAM fixture dependencies
      run: npm ci --prefix artifacts/compat-backoffice --no-audit --no-fund
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        cache-binary: false
        version: v0.38.0
        driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
    - name: Build and load the isolated PostgreSQL fixture
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: infra/docker/postgres/Dockerfile
        platforms: linux/amd64
        load: true
        push: false
        tags: portfolio-assistant-postgres:18.6
        cache-from: type=gha,version=2,scope=postgres-linux-amd64
    - name: Start the isolated non-root PostgreSQL fixture
      run: docker compose -f infra/compose/local.yaml -p assistant-ci up --no-build --pull never -d --wait --wait-timeout 90 postgres
    - name: Apply and verify migrations
      run: uv run python -m app.migrate
    - name: Verify real dual-application identities and independent recovery
      run: |
        mkdir -p artifacts
        uv run python -m scripts.verify_project_databases --authorize-fixture \
          --postgres-image portfolio-assistant-postgres:18.6 \
          --backoffice-path artifacts/compat-backoffice
    - name: Stop only the owned PostgreSQL fixture
      if: always()
      run: docker compose -f infra/compose/local.yaml -p assistant-ci stop postgres
    - name: Retain safe synthetic database verification receipt
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: project-database-verification
        path: artifacts/project-databases.json
        retention-days: 7
        if-no-files-found: ignore
  contract-bytes:
    name: Backoffice private contract bytes
    if: inputs.frontend_commit != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: gonzalomartinperez/portfolio-backoffice
        ref: ${{ inputs.frontend_commit }}
        path: frontend-contract
        sparse-checkout: contracts
        persist-credentials: false
    - name: Verify the paired backoffice private contract bytes
      run: |
        python - <<'PY'
        from pathlib import Path
        for name in ('operations.schema.json', 'product-analytics.schema.json', 'feedback.schema.json'):
            assert Path('contracts', name).read_bytes() == Path('frontend-contract/contracts', name).read_bytes(), name
        PY
