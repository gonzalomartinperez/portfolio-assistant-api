name: Dependabot policy
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request number for read-only risk assessment
        required: true
        type: string
permissions: {}
concurrency:
  group: dependency-policy-${{ github.event.pull_request.number || inputs.number || github.run_id }}
  cancel-in-progress: true
jobs:
  policy:
    if: github.event.pull_request.user.login == 'dependabot[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # workflow_sha is trusted workflow code, never a PR head or merge ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Assess authenticated metadata without approval or merging
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.dependabot_automation
