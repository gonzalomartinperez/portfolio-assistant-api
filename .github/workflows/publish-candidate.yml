name: Publish tested candidate (manual)
on:
  workflow_dispatch:
    inputs:
      frontend_image:
        description: Verified frontend image reference with sha256 digest
        type: string
        required: true
      frontend_commit:
        description: Full frontend Git commit SHA from its owner handoff
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: candidate-publish
  cancel-in-progress: false
jobs:
  validate:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate trusted manual inputs without shell interpolation
        env:
          WEB_IMAGE: ${{ inputs.frontend_image }}
          WEB_SHA: ${{ inputs.frontend_commit }}
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'[a-z0-9./_-]+@sha256:[0-9a-f]{64}', os.environ['WEB_IMAGE'])
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['WEB_SHA'])
          PY
  verify:
    needs: validate
    uses: ./.github/workflows/quality.yml
    with:
      export_image: true
      frontend_image: ${{ inputs.frontend_image }}
      frontend_commit: ${{ inputs.frontend_commit }}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tested-api-image
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested bytes and record paired revisions
        env:
          WEB_IMAGE: ${{ inputs.frontend_image }}
          WEB_SHA: ${{ inputs.frontend_commit }}
        run: |
          docker load -i tested-image.tar
          candidate_image="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}"
          docker tag portfolio-assistant-api:ci "$candidate_image"
          docker push "$candidate_image"
          immutable_image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$candidate_image")
          python -m scripts.release_manifest --api-image "$immutable_image" --web-image "$WEB_IMAGE" --api-sha "$GITHUB_SHA" --web-sha "$WEB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-manifest
          path: release.json
          retention-days: 30
