name: CI
'on':
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
    branches:
    - develop
    - main
  workflow_dispatch:
    inputs:
      verify_vendor_image:
        description: Deep OS/Java vendor assessment; required separately before release selection
        type: boolean
        default: false
  workflow_call:
    inputs:
      frontend_image:
        type: string
        default: ''
      frontend_commit:
        type: string
        default: ''
  push:
    branches:
    - develop
    - main
  merge_group: {}
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  AI_PROVIDER: fixture
  ALLOW_PAID_AI: 'false'
  LANGSMITH_TRACING: 'false'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
jobs:
  classify:
    name: classify
    permissions:
      contents: read
      pull-requests: read
    uses: gonzalomartinperez/engineering-standards/.github/workflows/classify.yml@1f33be46bcb95f42f550f74608bc679cae5575ad # v1.0.0
  security:
    name: Security checks
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.jobs), 'security')
    permissions:
      contents: read
      pull-requests: read
    uses: gonzalomartinperez/engineering-standards/.github/workflows/security.yml@1f33be46bcb95f42f550f74608bc679cae5575ad # v1.0.0
    with:
      dependency-review: true
      # Shared default list plus LGPL-3.0-only for psycopg (docs/adrs/009-psycopg-lgpl-exception.md).
      allow-licenses: MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BSD-3-Clause-Clear, ISC, 0BSD, BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, Unlicense, Python-2.0, PSF-2.0, Zlib, MPL-2.0, LGPL-3.0-only
  workflows:
    name: Workflow validation
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.jobs), 'workflows')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Bind exact source and build inputs
      run: python3 -m scripts.ci_identity
      env:
        CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    - name: Validate workflow syntax and shell steps
      run: bash scripts/check_workflows.sh
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Bind exact source and build inputs
      run: python3 -m scripts.ci_identity
      env:
        CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    - name: Scan tracked content and history without exposing secrets
      run: |
        mkdir -p artifacts
        python3 -m scripts.scan_secrets > artifacts/secret-scan.json
  static:
    name: Static checks
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.jobs), 'static')
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Bind exact source and build inputs
      run: python3 -m scripts.ci_identity
      env:
        CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.1
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          .python-version
    - name: Install locked dependencies
      run: uv sync --frozen
    - name: Validate portable repository skills
      run: uv run python -m scripts.validate_skills
    - name: Validate software licensing and separate content scope
      run: uv run python -m scripts.check_license
    - name: Lint Python
      run: uv run ruff check app tests contracts scripts
    - name: Check Python formatting
      run: uv run ruff format --check app tests contracts scripts
    - name: Type-check application boundaries
      run: uv run mypy
    - name: Verify authored bilingual question bank
      run: uv run python -m scripts.build_assistant_bank --check
    - name: Enforce architecture and run offline and contract tests
      run: |
        mkdir -p artifacts
        uv run pytest -q -m 'not integration' --junitxml=artifacts/unit.xml --cov --cov-branch --cov-report=xml:artifacts/coverage-unit.xml
      env:
        COVERAGE_FILE: artifacts/coverage-unit.data
    - name: Retain offline coverage data for the combined gate
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: coverage-unit
        path: |
          artifacts/coverage-unit.data
          artifacts/coverage-unit.xml
        retention-days: 7
        if-no-files-found: error
    - name: Verify public contract drift
      run: uv run python -m contracts.export && git diff --exit-code contracts
  database:
    name: Database tests
    if: contains(fromJSON(needs.classify.outputs.jobs), 'database')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5.26.32-community-trixie@sha256:f1e52d4dc6da122468c4a3c1050a4f5e117f6d3268625237c34d49166f0d6082
        env:
          NEO4J_AUTH: neo4j/change-me
          NEO4J_dbms_usage__report_enabled: 'false'
          NEO4J_server_bolt_telemetry_enabled: 'false'
        ports:
        - 7688:7687
        options: --health-cmd "cypher-shell -u neo4j -p change-me 'RETURN 1'" --health-interval 10s --health-timeout
          10s --health-retries 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Bind exact source and build inputs
      run: python3 -m scripts.ci_identity
      env:
        CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: gonzalomartinperez/portfolio
        ref: 1acbe54906c88398652aebb8eae0c217fd0d8821
        path: public-portfolio
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.1
        save-cache: false
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          .python-version
    - name: Install locked dependencies
      run: uv sync --frozen
    - name: Read the pinned IAM compatibility source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: gonzalomartinperez/portfolio-backoffice
        ref: 5238643d5f5cb1c129b66b7d527f440635f68d33
        path: artifacts/compat-backoffice
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: artifacts/compat-backoffice/.nvmrc
        cache: npm
        cache-dependency-path: artifacts/compat-backoffice/package-lock.json
    - name: Install the pinned IAM fixture dependencies
      run: npm ci --prefix artifacts/compat-backoffice --no-audit --no-fund
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: inputs.frontend_commit != ''
      with:
        repository: gonzalomartinperez/portfolio-backoffice
        ref: ${{ inputs.frontend_commit }}
        path: frontend-contract
        sparse-checkout: contracts
        persist-credentials: false
    - name: Verify the paired backoffice private contract bytes
      if: inputs.frontend_commit != ''
      run: |
        python - <<'PY'
        from pathlib import Path
        for name in ('operations.schema.json', 'product-analytics.schema.json', 'feedback.schema.json'):
            assert Path('contracts', name).read_bytes() == Path('frontend-contract/contracts', name).read_bytes(), name
        PY
    - name: Validate private networks and container limits
      run: uv run python -m scripts.validate_compose
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        cache-binary: false
        version: v0.38.0
        driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
    - name: Build and load the isolated PostgreSQL fixture
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: infra/docker/postgres/Dockerfile
        platforms: linux/amd64
        load: true
        push: false
        tags: portfolio-assistant-postgres:18.6
        cache-from: type=gha,version=2,scope=postgres-linux-amd64
    - name: Build and start the isolated non-root PostgreSQL fixture
      id: postgres
      run: |
        docker compose -f infra/compose/local.yaml -p assistant-ci up --no-build --pull never -d --wait --wait-timeout 90 postgres
        postgres_id=$(docker compose -f infra/compose/local.yaml -p assistant-ci ps -q postgres)
        test -n "$postgres_id"
        echo "container_id=$postgres_id" >> "$GITHUB_OUTPUT"
    - name: Apply and verify migrations
      run: uv run python -m app.migrate
    - name: Index the pinned approved public corpus
      run: uv run python -m app.knowledge_sync --repo public-portfolio --ref HEAD
    - name: Run real-service integration tests
      run: |
        mkdir -p artifacts
        uv run pytest -q -m integration --junitxml=artifacts/integration.xml \
          --cov --cov-branch --cov-report=xml:artifacts/coverage-integration.xml
      env:
        TEST_INTEGRATION: '1'
        COVERAGE_FILE: artifacts/coverage-integration.data
        EVALUATION_POSTGRES_CONTAINER: ${{ steps.postgres.outputs.container_id }}
        EVALUATION_NEO4J_CONTAINER: ${{ job.services.neo4j.id }}
    - name: Exercise representative bilingual question families
      run: uv run python -m scripts.evaluate_assistant --mode fixture --split development --limit 10 --output artifacts/question-sample.json
      env:
        EVALUATION_POSTGRES_CONTAINER: ${{ steps.postgres.outputs.container_id }}
        EVALUATION_NEO4J_CONTAINER: ${{ job.services.neo4j.id }}
    - name: Verify real dual-application identities and independent recovery
      run: |
        uv run python -m scripts.verify_project_databases --authorize-fixture \
          --postgres-image portfolio-assistant-postgres:18.6 \
          --backoffice-path artifacts/compat-backoffice
    - name: Stop only the owned PostgreSQL fixture
      if: always()
      run: |
        mkdir -p artifacts
        docker compose -f infra/compose/local.yaml -p assistant-ci logs --no-color postgres > artifacts/postgres-fixture.log
        docker compose -f infra/compose/local.yaml -p assistant-ci stop postgres
    - name: Retain integration coverage data
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: coverage-integration
        path: |
          artifacts/coverage-integration.data
          artifacts/coverage-integration.xml
        retention-days: 7
        if-no-files-found: ignore
    - name: Retrieve offline coverage data from the static job
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: coverage-unit
        path: artifacts/coverage-unit
    - name: Combine both lanes and enforce the coverage floors
      run: |
        uv run coverage combine --keep artifacts/coverage-unit/coverage-unit.data artifacts/coverage-integration.data
        uv run coverage xml -o artifacts/coverage.xml
        uv run coverage report --skip-covered
        uv run python -m scripts.coverage_gate artifacts/coverage.xml
      env:
        COVERAGE_FILE: artifacts/coverage-combined.data
    - name: Require 90 percent coverage on the lines this pull request changes
      if: github.event_name == 'pull_request'
      run: uv run diff-cover artifacts/coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=90
      env:
        BASE_REF: ${{ github.base_ref }}
    - name: Retain the combined coverage report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: coverage-combined
        path: artifacts/coverage.xml
        retention-days: 7
        if-no-files-found: ignore
    - name: Retain safe synthetic database verification receipt
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: project-database-verification
        path: artifacts/project-databases.json
        retention-days: 7
        if-no-files-found: ignore
    needs:
    - classify
    - static
  container:
    name: Container verification
    if: contains(fromJSON(needs.classify.outputs.jobs), 'container')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5.26.32-community-trixie@sha256:f1e52d4dc6da122468c4a3c1050a4f5e117f6d3268625237c34d49166f0d6082
        env:
          NEO4J_AUTH: neo4j/change-me
          NEO4J_dbms_usage__report_enabled: 'false'
          NEO4J_server_bolt_telemetry_enabled: 'false'
        ports:
        - 7688:7687
        options: --health-cmd "cypher-shell -u neo4j -p change-me 'RETURN 1'" --health-interval 10s --health-timeout
          10s --health-retries 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Bind exact source and build inputs
      run: python3 -m scripts.ci_identity
      env:
        CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: gonzalomartinperez/portfolio
        ref: 1acbe54906c88398652aebb8eae0c217fd0d8821
        path: public-portfolio
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.1
        enable-cache: false
    - name: Install locked dependencies
      run: uv sync --frozen
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: inputs.frontend_commit != ''
      with:
        repository: gonzalomartinperez/portfolio-backoffice
        ref: ${{ inputs.frontend_commit }}
        path: frontend-contract
        sparse-checkout: contracts
        persist-credentials: false
    - name: Verify the paired backoffice private contract bytes
      if: inputs.frontend_commit != ''
      run: |
        python - <<'PY'
        from pathlib import Path
        for name in ('operations.schema.json', 'product-analytics.schema.json', 'feedback.schema.json'):
            assert Path('contracts', name).read_bytes() == Path('frontend-contract/contracts', name).read_bytes(), name
        PY
    - name: Validate private networks and container limits
      run: uv run python -m scripts.validate_compose
    - name: Lint Dockerfiles with the pinned hadolint binary
      run: |
        mkdir -p /tmp/image-lint
        # Source: https://github.com/hadolint/hadolint/releases/download/v2.15.1/checksums.sha256
        curl --fail --silent --show-error --location --retry 3 --max-time 120 \
          https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 \
          --output /tmp/image-lint/hadolint
        echo 'c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  /tmp/image-lint/hadolint' | sha256sum --check
        chmod +x /tmp/image-lint/hadolint
        /tmp/image-lint/hadolint --config .hadolint.yaml infra/docker/app/Dockerfile infra/docker/postgres/Dockerfile
    - name: Compute image build metadata
      run: |
        {
          echo "IMAGE_VERSION=sha-${REVISION::7}"
          echo "IMAGE_REVISION=${REVISION}"
          echo "IMAGE_CREATED=$(git show --no-patch --format=%cI "$REVISION")"
        } >> "$GITHUB_ENV"
      env:
        REVISION: ${{ github.sha }}
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        cache-binary: false
        version: v0.38.0
        driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
    - name: Build and load the isolated PostgreSQL fixture
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: infra/docker/postgres/Dockerfile
        platforms: linux/amd64
        load: true
        push: false
        tags: portfolio-assistant-postgres:18.6
        cache-from: type=gha,version=2,scope=postgres-linux-amd64
        cache-to: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && 'type=gha,version=2,mode=max,scope=postgres-linux-amd64' || '' }}
    - name: Build and start the isolated non-root PostgreSQL fixture
      id: postgres
      run: |
        docker compose -f infra/compose/local.yaml -p assistant-ci up --no-build --pull never -d --wait --wait-timeout 90 postgres
        postgres_id=$(docker compose -f infra/compose/local.yaml -p assistant-ci ps -q postgres)
        test -n "$postgres_id"
        echo "container_id=$postgres_id" >> "$GITHUB_OUTPUT"
    - name: Apply and verify migrations
      run: uv run python -m app.migrate
    - name: Index the pinned approved public corpus
      run: uv run python -m app.knowledge_sync --repo public-portfolio --ref HEAD
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: infra/docker/app/Dockerfile
        target: api
        load: true
        push: false
        tags: portfolio-assistant-api:ci
        cache-from: type=gha,scope=api-linux-amd64
        cache-to: type=gha,mode=max,scope=api-linux-amd64
        labels: org.opencontainers.image.revision=${{ github.sha }}
        build-args: |
          VERSION=${{ env.IMAGE_VERSION }}
          REVISION=${{ env.IMAGE_REVISION }}
          CREATED=${{ env.IMAGE_CREATED }}
    - name: Build and load the worker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: infra/docker/app/Dockerfile
        target: worker
        load: true
        push: false
        tags: portfolio-assistant-api-worker:ci
        build-args: |
          VERSION=${{ env.IMAGE_VERSION }}
          REVISION=${{ env.IMAGE_REVISION }}
          CREATED=${{ env.IMAGE_CREATED }}
    - name: Verify pinned image scanner
      run: |
        mkdir -p /tmp/image-scanner artifacts
        curl --fail --silent --show-error --location --retry 3 --max-time 120 \
          https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz \
          --output /tmp/image-scanner/trivy.tar.gz
        echo 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  /tmp/image-scanner/trivy.tar.gz' | sha256sum --check
        tar -xzf /tmp/image-scanner/trivy.tar.gz -C /tmp/image-scanner trivy
    - name: Inventory the tested image and reject critical or fixable high findings
      run: |
        /tmp/image-scanner/trivy --config '' image --image-src docker \
          --ignorefile '' --scanners vuln --format json \
          --output artifacts/image-vulnerabilities.json portfolio-assistant-api:ci
        image_id=$(docker image inspect portfolio-assistant-api:ci --format '{{.Id}}')
        uv run python -m scripts.image_security \
          --report artifacts/image-vulnerabilities.json --image-id "$image_id" | tee artifacts/image-security-summary.json
    - name: Inventory the worker image and reject critical or fixable high findings
      run: |
        /tmp/image-scanner/trivy --config '' image --image-src docker \
          --ignorefile '' --scanners vuln --format json \
          --output artifacts/worker-vulnerabilities.json portfolio-assistant-api-worker:ci
        image_id=$(docker image inspect portfolio-assistant-api-worker:ci --format '{{.Id}}')
        uv run python -m scripts.image_security \
          --report artifacts/worker-vulnerabilities.json --image-id "$image_id" | tee artifacts/worker-security-summary.json
    - name: Inventory PostgreSQL and reject critical or fixable high findings
      run: |
        /tmp/image-scanner/trivy --config '' image --image-src docker \
          --ignorefile '' --scanners vuln --list-all-pkgs --format json \
          --output artifacts/postgres-vulnerabilities.json portfolio-assistant-postgres:18.6
        docker image inspect portfolio-assistant-postgres:18.6 --format '{{.Id}}' > artifacts/postgres-image-id.txt
        image_id=$(cat artifacts/postgres-image-id.txt)
        uv run python -m scripts.image_security \
          --report artifacts/postgres-vulnerabilities.json --image-id "$image_id" | tee artifacts/postgres-security-summary.json
    - name: Deep-scan the exact Neo4j vendor image for release assessment
      if: github.event_name == 'workflow_dispatch' && inputs.verify_vendor_image
      run: |
        reference=$(uv run python -c "import yaml; from pathlib import Path; print(yaml.safe_load(Path('infra/compose/local.yaml').read_text())['services']['neo4j']['image'])")
        /tmp/image-scanner/trivy --config '' image --image-src docker \
          --ignorefile '' --scanners vuln --list-all-pkgs --timeout 10m --format json \
          --output artifacts/neo4j-vulnerabilities.json "$reference"
        docker image inspect "$reference" --format '{{.Id}}' > artifacts/neo4j-image-id.txt
        /tmp/image-scanner/trivy --config '' version --format json > artifacts/scanner-version.json
        uv run python -m scripts.database_security_receipt \
          --report artifacts/neo4j-vulnerabilities.json \
          --image-id-file artifacts/neo4j-image-id.txt \
          --scanner-version artifacts/scanner-version.json --reference "$reference"
    - name: Verify pinned container-structure-test
      run: |
        mkdir -p /tmp/image-tests
        # Source: https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/checksums.txt
        curl --fail --silent --show-error --location --retry 3 --max-time 120 \
          https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/container-structure-test-linux-amd64 \
          --output /tmp/image-tests/container-structure-test
        echo 'fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca  /tmp/image-tests/container-structure-test' | sha256sum --check
        chmod +x /tmp/image-tests/container-structure-test
    - name: Test the API image structure
      run: |
        /tmp/image-tests/container-structure-test test --image portfolio-assistant-api:ci \
          --config infra/docker/app/container-structure-test.yaml
    - name: Test the worker image structure
      run: |
        /tmp/image-tests/container-structure-test test --image portfolio-assistant-api-worker:ci \
          --config infra/docker/app/container-structure-test.worker.yaml
    - name: Verify pinned Dockle
      run: |
        mkdir -p /tmp/image-dockle
        # Source: https://github.com/goodwithtech/dockle/releases/download/v0.4.15/dockle_0.4.15_checksums.txt
        curl --fail --silent --show-error --location --retry 3 --max-time 120 \
          https://github.com/goodwithtech/dockle/releases/download/v0.4.15/dockle_0.4.15_Linux-64bit.tar.gz \
          --output /tmp/image-dockle/dockle.tar.gz
        echo '8bfc9183d1d3d67800edb45bea4bb63ddf1d28bec5f89944075a07007d79caad  /tmp/image-dockle/dockle.tar.gz' | sha256sum --check
        tar -xzf /tmp/image-dockle/dockle.tar.gz -C /tmp/image-dockle dockle
    - name: Lint the API image with Dockle
      # Exit on WARN and FATAL. CIS-DI-0005 (content trust) is a client-side pull setting; base images are
      # pinned by digest instead. DKL-DI-0005 misreads the python base layer's `apt-get dist-clean`;
      # the structure tests assert that no apt lists remain in the final image.
      run: |
        /tmp/image-dockle/dockle --exit-code 1 --exit-level warn \
          -i CIS-DI-0005 -i DKL-DI-0005 portfolio-assistant-api:ci
    - name: Lint the worker image with Dockle
      # Same as the API image, plus CIS-DI-0006: the worker is a background watcher with no HTTP endpoint,
      # so it has no readiness probe to declare as a HEALTHCHECK.
      run: |
        /tmp/image-dockle/dockle --exit-code 1 --exit-level warn \
          -i CIS-DI-0005 -i CIS-DI-0006 -i DKL-DI-0005 portfolio-assistant-api-worker:ci
    - name: Enforce the image size ratchet
      run: |
        api_max=$(jq -er '.api_max_bytes' infra/docker/app/image.json)
        worker_max=$(jq -er '.worker_max_bytes' infra/docker/app/image.json)
        api_size=$(docker image inspect --format '{{.Size}}' portfolio-assistant-api:ci)
        worker_size=$(docker image inspect --format '{{.Size}}' portfolio-assistant-api-worker:ci)
        echo "api ${api_size} bytes (max ${api_max}); worker ${worker_size} bytes (max ${worker_max})"
        test "$api_size" -le "$api_max"
        test "$worker_size" -le "$worker_max"
    - name: Verify image streaming and graceful shutdown
      run: uv run python -m scripts.container_smoke --image portfolio-assistant-api:ci > artifacts/container-smoke.json
    - name: Verify proxy routing and stream cancellation
      run: uv run python -m scripts.proxy_smoke --image portfolio-assistant-api:ci > artifacts/proxy-smoke.json
      env:
        FRONTEND_IMAGE: ${{ inputs.frontend_image }}
    - name: Record tested image identities
      run: |
        python3 -m scripts.ci_identity --image portfolio-assistant-api:ci --image portfolio-assistant-postgres:18.6
      env:
        CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    - name: Stop only the owned PostgreSQL fixture
      if: always()
      run: |
        mkdir -p artifacts
        docker compose -f infra/compose/local.yaml -p assistant-ci logs --no-color postgres > artifacts/postgres-fixture.log
        docker compose -f infra/compose/local.yaml -p assistant-ci stop postgres
    needs:
    - classify
    - static
  ci-gate:
    name: ci-gate
    if: always()
    needs:
    - classify
    - workflows
    - secrets
    - security
    - static
    - database
    - container
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
    - uses: gonzalomartinperez/engineering-standards/actions/ci-gate@1f33be46bcb95f42f550f74608bc679cae5575ad # v1.0.0
      with:
        needs: ${{ toJSON(needs) }}
        expected: ${{ needs.classify.outputs.jobs }}
  # Transitional: branch protection still requires "Required checks". Remove this job after the
  # owner switches the required check to `ci-gate` (docs/reference/repo-settings.md).
  checks:
    name: Required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    if: always()
    needs:
    - ci-gate
    steps:
    - name: Require the ci-gate job to succeed
      run: test "${CI_GATE_RESULT}" = success
      env:
        CI_GATE_RESULT: ${{ needs.ci-gate.result }}
