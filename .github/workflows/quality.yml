name: Quality
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      export_image:
        type: boolean
        default: false
      frontend_image:
        type: string
        default: ''
      frontend_commit:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  AI_PROVIDER: fixture
  ALLOW_PAID_AI: 'false'
  LANGSMITH_TRACING: 'false'
  DOCKER_BUILD_RECORD_RETENTION_DAYS: '7'
jobs:
  static:
    name: Static and offline
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.9.13'
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Validate workflow syntax and shell steps
        run: bash scripts/check_workflows.sh
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Validate portable repository skills
        run: uv run python -m scripts.validate_skills
      - name: Lint Python
        run: uv run ruff check app tests contracts scripts
      - name: Check Python formatting
        run: uv run ruff format --check app tests contracts scripts
      - name: Type-check application boundaries
        run: uv run mypy
      - name: Verify authored bilingual question bank
        run: uv run python -m scripts.build_assistant_bank --check
      - name: Run offline and contract tests
        run: |
          mkdir -p artifacts
          uv run pytest -q -m 'not integration' --junitxml=artifacts/unit.xml
      - name: Scan tracked content and history without exposing secrets
        run: uv run python -m scripts.scan_secrets > artifacts/secret-scan.json
      - name: Verify public contract drift
        run: uv run python -m contracts.export && git diff --exit-code contracts
      - name: Audit live dependency controls without mutations
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: uv run python -m scripts.dependabot_automation --audit-pr "$PR_NUMBER" > artifacts/dependency-policy-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: static-diagnostics
          path: artifacts/
          retention-days: 7
  integration:
    name: Real services and container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U assistant"
          --health-interval 5s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5.26.17-community@sha256:d31525aa50da9215d692e5e824696c63583636398f5f5b60260bb92f94095c70
        env:
          NEO4J_AUTH: neo4j/change-me
        ports: ['7688:7687']
        options: >-
          --health-cmd "cypher-shell -u neo4j -p change-me 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gonzalomartinperez/portfolio
          ref: 1acbe54906c88398652aebb8eae0c217fd0d8821
          path: public-portfolio
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.9.13'
          save-cache: false
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Install locked dependencies
        run: uv sync --frozen
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: inputs.frontend_commit != ''
        with:
          repository: gonzalomartinperez/portfolio-assistant-web
          ref: ${{ inputs.frontend_commit }}
          path: frontend-contract
          sparse-checkout: contracts
          persist-credentials: false
      - name: Verify the paired frontend contract bytes
        if: inputs.frontend_commit != ''
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('openapi.json', 'sse.schema.json', 'sse.examples.json'):
              assert Path('contracts', name).read_bytes() == Path('frontend-contract/contracts', name).read_bytes(), name
          PY
      - name: Validate private networks and container limits
        run: uv run python -m scripts.validate_compose
      - name: Apply and verify migrations
        run: uv run python -m app.migrate
      - name: Index the pinned approved public corpus
        run: uv run python -m app.knowledge_sync --repo public-portfolio --ref HEAD
      - name: Run real-service integration tests
        run: |
          mkdir -p artifacts
          uv run pytest -q -m integration --junitxml=artifacts/integration.xml
        env:
          TEST_INTEGRATION: '1'
      - name: Exercise representative bilingual question families
        run: uv run python -m scripts.evaluate_assistant --mode fixture --split development --limit 10 --output artifacts/question-sample.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: portfolio-assistant-api:ci
          cache-from: type=gha,scope=api-linux-amd64
          cache-to: type=gha,mode=max,scope=api-linux-amd64
      - name: Verify image streaming and graceful shutdown
        run: uv run python -m scripts.container_smoke --image portfolio-assistant-api:ci > artifacts/container-smoke.json
      - name: Verify proxy routing and stream cancellation
        run: uv run python -m scripts.proxy_smoke --image portfolio-assistant-api:ci > artifacts/proxy-smoke.json
        env:
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
      - name: Export the tested image for manual publishing
        if: inputs.export_image && github.event_name == 'workflow_dispatch'
        run: docker save portfolio-assistant-api:ci -o artifacts/tested-image.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: inputs.export_image && github.event_name == 'workflow_dispatch'
        with:
          name: tested-api-image
          path: artifacts/tested-image.tar
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: integration-diagnostics
          path: |
            artifacts/*.xml
            artifacts/*.json
          retention-days: 7
  checks:
    permissions: {}
    name: checks
    if: always()
    needs: [static, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve the required aggregate gate
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$STATIC_RESULT" = success && test "$INTEGRATION_RESULT" = success
