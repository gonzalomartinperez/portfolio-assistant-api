version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    rebase-strategy: auto
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    allow:
      - dependency-type: all
    groups:
      test-runner-patches:
        patterns: ["pytest"]
        update-types: [patch]
      ini-parser-compatible:
        patterns: ["iniconfig"]
        update-types: [minor, patch]
      python-review:
        patterns: ["*"]
        exclude-patterns: ["pytest", "iniconfig"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    rebase-strategy: auto
    open-pull-requests-limit: 2
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    rebase-strategy: auto
    open-pull-requests-limit: 2
    groups:
      images-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Python minor/major changes need an explicit project decision.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
