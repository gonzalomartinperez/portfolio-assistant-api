# DISABLED TEMPLATE: outside .github/workflows. Do not activate without owner approval.
name: Approved VPS deployment
on:
  workflow_dispatch:
    inputs:
      manifest_artifact:
        description: Reviewed release-candidate manifest artifact ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: production-vps
  cancel-in-progress: false
jobs:
  deploy:
    # Before activation, create this environment with required human reviewers.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.manifest_artifact }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
      # Provision a restricted deployment account and reviewed known_hosts first.
      # The operator runs deploy/apply-release.sh with this approved manifest on
      # the VPS. Add the SSH transport only after host/account authorization.
      - run: python -m scripts.validate_release_file release.json
      - run: echo 'Template only. SSH transport and production authorization are not configured.'
