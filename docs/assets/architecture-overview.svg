<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="architecture-title architecture-description">
<title id="architecture-title">Evidence to conversation</title><desc id="architecture-description">Approved portfolio revisions synchronize into versioned PostgreSQL/vector and Neo4j evidence. Native chat sends owned session and CSRF requests to the API/LangGraph workflow. Bounded context goes to OpenAI GPT-6 Luna; streamed responses return to the visitor. Count-only operations feed the private backoffice. This is a system overview, not production acceptance.</desc>
<style>
:root { --canvas:#f7f9fc; --group:#edf2f8; --card:#fff; --ink:#132238; --muted:#40526b; --line:#526780; --border:#6b829b; --accent:#036e87; }
@media (prefers-color-scheme:dark) { :root { --canvas:#0b1220; --group:#102035; --card:#111d2e; --ink:#edf3ff; --muted:#b0c0d6; --line:#94aec9; --border:#7188a2; --accent:#56d5f4; } }
text { font-family:Arial,Helvetica,sans-serif; fill:var(--ink); }
.canvas { fill:var(--canvas); }
.group { fill:var(--group); stroke:var(--border); stroke-dasharray:5 5; }
.card { fill:var(--card); stroke:var(--border); }
.label { font-family:monospace; font-size:13px; letter-spacing:1.4px; fill:var(--muted); }
.title { font-size:30px; font-weight:700; }
.heading { font-size:21px; font-weight:700; }
.body { font-size:16px; fill:var(--muted); }
.edge-label { font-size:14px; fill:var(--muted); }
.edge { fill:none; stroke:var(--line); stroke-width:2; stroke-linejoin:round; }
.response { stroke-dasharray:6 5; stroke:var(--accent); }
.arrow { fill:var(--line); }
.response-arrow { fill:var(--accent); }
.accent { fill:var(--accent); }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10Z"/></marker><marker id="response-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="response-arrow" d="M0 0L10 5L0 10Z"/></marker></defs>
<rect class="canvas" width="1120" height="650" rx="18"/>
<text x="40" y="40" class="label">GMP / ASSISTANT API</text><text x="40" y="83" class="title">Evidence to conversation</text><text x="40" y="115" class="body">Approved knowledge. Explicit boundaries. Useful visibility.</text><rect class="group" x="24" y="150" width="260" height="440" rx="16"/><text x="44" y="180" class="label">PUBLIC INPUTS</text><rect class="group" x="334" y="150" width="420" height="440" rx="16"/><text x="354" y="180" class="label">APPLICATION + PRIVATE DATA</text><rect class="group" x="804" y="150" width="292" height="224" rx="16"/><text x="824" y="180" class="label">EXTERNAL PROVIDER</text><rect class="group" x="804" y="406" width="292" height="184" rx="16"/><text x="824" y="436" class="label">PRIVATE OBSERVABILITY</text><g><rect class="card" x="56" y="210" width="196" height="120" rx="12"/><text x="74" y="242" class="heading">Native chat</text><text x="74" y="270" class="body">Questions + sources</text><text x="74" y="294" class="body">English / Spanish</text></g><g><rect class="card" x="362" y="210" width="364" height="120" rx="12"/><text x="380" y="242" class="heading">HTTP + LangGraph</text><text x="380" y="270" class="body">Session ownership · CSRF</text><text x="380" y="294" class="body">Retrieve → ground → stream</text></g><g><rect class="card" x="832" y="210" width="236" height="120" rx="12"/><text x="850" y="242" class="heading">OpenAI only</text><text x="850" y="270" class="body">GPT-6 Luna · medium</text><text x="850" y="294" class="body">No model fallback</text></g><g><rect class="card" x="56" y="440" width="196" height="106" rx="12"/><text x="74" y="472" class="heading">Public revisions</text><text x="74" y="500" class="body">Approved public source</text><text x="74" y="524" class="body">Observe + index</text></g><g><rect class="card" x="362" y="440" width="364" height="106" rx="12"/><text x="380" y="472" class="heading">Versioned evidence</text><text x="380" y="500" class="body">PostgreSQL + pgvector · Neo4j</text><text x="380" y="524" class="body">Approved public corpus only</text></g><g><rect class="card" x="832" y="454" width="236" height="106" rx="12"/><text x="850" y="486" class="heading">Private operations</text><text x="850" y="514" class="body">Counts, health, feedback</text><text x="850" y="538" class="body">Backoffice · opt-in OTLP</text></g><path class="edge" d="M252 246H362" marker-end="url(#arrow)"/><text x="282" y="235" class="edge-label">request</text><path class="edge response" d="M362 294H252" marker-end="url(#response-arrow)"/><text x="285" y="320" class="edge-label">SSE</text><path class="edge" d="M726 246H832" marker-end="url(#arrow)"/><text x="756" y="235" class="edge-label">context</text><path class="edge response" d="M832 294H726" marker-end="url(#response-arrow)"/><path class="edge" d="M544 330V440" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="558" y="389" class="edge-label">retrieve / cite</text><path class="edge" d="M252 494H362" marker-end="url(#arrow)"/><text x="286" y="483" class="edge-label">sync</text><path class="edge" d="M726 316H780V506H832" marker-end="url(#arrow)"/><text x="784" y="395" class="edge-label">counts</text><path class="edge" d="M40 621H73" marker-end="url(#arrow)"/><text x="86" y="626" class="edge-label">Request / sync</text><path class="edge response" d="M242 621H275" marker-end="url(#response-arrow)"/><text x="288" y="626" class="edge-label">Returned data</text><text x="484" y="626" class="edge-label">Dashed frames: trust boundaries · production selection belongs to vps-ops</text></svg>
