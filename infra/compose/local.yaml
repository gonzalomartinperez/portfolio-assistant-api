# Isolated local development/test services; production composition belongs to vps-ops.
name: portfolio-assistant-local
services:
  postgres:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    image: portfolio-assistant-postgres:18.6
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "max_connections=50"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 128
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
      - /var/run/postgresql:rw,nosuid,nodev,uid=70,gid=70,mode=3775,size=8m
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes: ["postgres18_alpine_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "assistant", "-d", "assistant"]
      interval: 5s
      retries: 10
  neo4j:
    image: neo4j:5.26.32-community-trixie@sha256:f1e52d4dc6da122468c4a3c1050a4f5e117f6d3268625237c34d49166f0d6082
    environment:
      NEO4J_AUTH: neo4j/change-me
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_server_bolt_telemetry_enabled: "false"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 256m
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.0
    pids_limit: 192
    stop_grace_period: 60s
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    ports: ["127.0.0.1:${NEO4J_HTTP_PORT:-7475}:7474", "127.0.0.1:${NEO4J_PORT:-7688}:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "change-me", "RETURN 1"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 10
volumes:
  postgres18_alpine_data:
  neo4j_data:
